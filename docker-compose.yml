services:
  db:
    image: postgres:16-alpine
    container_name: keo_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: keo
    ports:
      - "5432:5432"
    volumes:
      - keo_pgdata:/var/lib/postgresql/data

volumes:
  keo_pgdata:
